# Repo-owned factory settings (seeded once per profile, then yours). T3: risk.toml protects it,
# because it decides what bash_guard.sh allows. After editing, run `julia scripts/gen.jl`.
# Globs use the risk.toml rule: `*` matches any characters INCLUDING `/` (so `**` = `*`).
# Seeded from factory/profiles/package/ (profile `package`).
version = 1

[bash_guard]
# Directories (absolute or ~/...) where only read-only commands may RUN: cat, head, tail,
# less, grep, rg, find (no -exec/-delete), ls, wc, stat, file, cd/pwd, and git
# log/show/diff/status/blame/ls-files. Anything else whose working directory (cwd, a tracked
# `cd`, `git -C`, `make -C`, `uv --directory/--project`, `julia --project=`) is inside one is
# blocked. Rendered into .claude/hooks/read-only-roots.txt by scripts/gen.jl, merged with the
# read_only_roots of .agents/factory.local.toml (gitignored, like the rendered file): put
# private paths there, never in this committed file.
read_only_roots = []
# true: bash_guard fails closed while no roots are rendered (a fresh clone before gen.jl).
require_read_only_roots = false

[check_docs]
# Markdown files (repo-relative) that scripts/check_docs.jl does not check. Every package
# carries verbatim copies whose references point into the coordinator: docs/agent/ (the
# lead's ECOSYSTEM.md and BRIEF.md) and test/contracts/*.md (the upstream contract files).
exclude = ["docs/agent/*", "test/contracts/*.md"]
# References that are allowed to be missing here (provided by someone else, or named on
# purpose), e.g. "docs/agent/*" when the lead copies those files in.
external = []
# Skip references inside ``` fenced code blocks.
ignore_fenced = false

[check_claims]
# scripts/check_claims.jl (0.2.4): Markdown files (globs) scanned for `<!-- claim: key=value -->`
# markers; empty = every tracked *.md. `required`: claim keys that must have at least one marker
# (max_open, roles, factory_version, max_lines:<glob>, tests_pass, tests_total, ...).
files = []
required = ["max_open"]   # the CLAUDE.md lane-cap line carries its marker
